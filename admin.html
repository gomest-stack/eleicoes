<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador - Lançamento de Votos (ADMIN)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; padding: 20px; }
        .admin-card { max-width: 900px; margin: 0 auto; background: #ffffff; padding: 28px; border-radius: 18px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); border: 1px solid #e2e8f0; }
        h1 { text-align: center; margin-bottom: 20px; font-size: 24px; color: #0f172a; font-weight: 800; }
        
        .control-btns { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        button { flex: 1; min-width: 130px; padding: 12px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; transition: all 0.2s ease; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .btn-open { background-color: #16a34a; color: white; }
        .btn-close { background-color: #dc2626; color: white; }
        .btn-turno { background-color: #0288d1; color: white; width: 100%; margin-bottom: 16px; font-size: 14px; }
        .btn-add { background-color: #d97706; color: white; margin-bottom: 20px; width: 100%; font-size: 15px; }
        .btn-remove { background-color: #ef4444; color: white; padding: 4px 10px; font-size: 12px; border-radius: 6px; }
        .btn-save { background-color: #2563eb; color: white; width: 100%; margin-top: 20px; font-size: 16px; padding: 14px; }
        .btn-print { background-color: #475569; color: white; width: 100%; margin-top: 10px; font-size: 15px; padding: 12px; }
        .btn-reset { background-color: #991b1b; color: white; width: 100%; margin-top: 10px; font-size: 14px; padding: 10px; }

        .candidatos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .cand-card-admin { 
            background: #f8fafc; 
            padding: 18px; 
            border-radius: 14px; 
            border: 1px solid #e2e8f0; 
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            position: relative;
        }
        .cand-header-admin { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        .cand-header-admin h3 { font-size: 15px; color: #0f172a; font-weight: 700; }
        
        .photo-center { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 4px 0; }
        .preview-img-admin { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid #2563eb; background-color: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .photo-status { font-size: 11px; font-weight: 600; color: #16a34a; }

        label { display: block; margin-top: 6px; margin-bottom: 4px; font-size: 12px; color: #475569; font-weight: 700; text-transform: uppercase; }
        input[type="number"], input[type="text"], input[type="file"] { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; font-size: 14px; }
        
        .increment-box { background: #ffffff; border: 1px solid #cbd5e1; padding: 10px; border-radius: 8px; margin-top: 4px; }
        .increment-row { display: flex; gap: 6px; margin-top: 4px; }
        .btn-inc-add { background: #16a34a; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; white-space: nowrap; font-size: 13px; }
        .quick-btns { display: flex; gap: 6px; margin-top: 6px; }
        .btn-quick { background: #e2e8f0; color: #0f172a; border: none; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; flex: 1; }
        .btn-quick:hover { background: #cbd5e1; }

        .global-box { background: #f8fafc; padding: 18px; border-radius: 14px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        
        .badge-turno-info { text-align: center; font-weight: bold; color: #92400e; background: #fef3c7; padding: 10px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; border: 1px solid #fde68a; }

        .chart-box-admin { background: #f8fafc; padding: 18px; border-radius: 14px; border: 1px solid #e2e8f0; margin-top: 20px; }
        .chart-box-admin h3 { font-size: 15px; color: #0f172a; margin-bottom: 12px; text-align: center; }

        @media print {
            body { background: white; padding: 0; }
            .admin-card { border: none; box-shadow: none; max-width: 100%; width: 100%; padding: 0; }
            .control-btns, .btn-add, .btn-save, .btn-print, .btn-reset, .btn-turno, input[type="file"], .btn-remove, .increment-box, .quick-btns { display: none !important; }
            input { border: none !important; background: transparent !important; font-weight: bold; font-size: 16px !important; }
            .cand-card-admin { border: 1px solid #cbd5e1 !important; page-break-inside: avoid; }
            .chart-box-admin { page-break-inside: avoid; margin-top: 30px; border: 1px solid #cbd5e1; }
        }
    </style>
</head>
<body>
    <div class="admin-card">
        <h1>Boletim de Apuração - Painel de Controle</h1>

        <div id="turnoInfo" class="badge-turno-info">Fase Atual: 1º TURNO</div>
        
        <div class="control-btns">
            <button class="btn-open" onclick="setStatus('ABERTA')">Abrir Votação</button>
            <button class="btn-close" onclick="setStatus('FECHADA')">Encerrar Votação</button>
        </div>

        <button type="button" class="btn-turno" onclick="alternarTurno()">🔄 Alternar / Avançar para 2º Turno</button>
        <button type="button" class="btn-add" onclick="adicionarCandidato()">+ Adicionar Novo Candidato</button>

        <form id="adminForm">
            <div class="global-box">
                <h3>Configurações Globais da Eleição</h3>
                <label>Título / Nome da Eleição:</label>
                <input type="text" id="tituloEleicao" placeholder="Ex: Eleição para Direção Escolar 2026" value="Eleições - Apuração Oficial">
                
                <label>Total de Eleitores Aptos (Esperados):</label>
                <input type="number" id="totalEleitores" value="0" min="0" placeholder="Ex: 500">
            </div>

            <h3 style="margin-bottom: 10px; color: #0f172a;">Candidatos Cadastrados</h3>
            <div id="listaCandidatos" class="candidatos-grid"></div>

            <div class="global-box">
                <h3>Votos Secundários</h3>
                <label>Votos Brancos:</label>
                <input type="number" id="brancos" value="0" min="0">
                <label>Votos Nulos:</label>
                <input type="number" id="nulos" value="0" min="0">
            </div>

            <div class="chart-box-admin">
                <h3>Evolução dos Votos (Boletim de Urna)</h3>
                <canvas id="graficoAdmin" style="width: 100%; height: 220px;"></canvas>
            </div>

            <button type="button" class="btn-save" onclick="salvarApuracao()">Atualizar Apuração (Lançar Votos)</button>
            <button type="button" class="btn-print" onclick="imprimirBoletim()">📄 Imprimir Boletim de Apuração (Com Gráfico)</button>
            <button type="button" class="btn-reset" onclick="zerarSistema()">⚠️ Zerar / Encerrar Eleição (Limpar Tudo)</button>
        </form>
    </div>

    <script>
        let statusAtual = 'ABERTA';
        let turnoAtual = '1';
        let historicoVotos = [];

        let candidatos = [
            { id: 1, nome: 'Candidato A', foto: '', votos: 0 },
            { id: 2, nome: 'Candidato B', foto: '', votos: 0 }
        ];

        function carregarDadosSalvos() {
            const salvas = localStorage.getItem('dadosApuracao');
            if (salvas) {
                try {
                    const data = JSON.parse(salvas);
                    if (data.tituloEleicao) document.getElementById('tituloEleicao').value = data.tituloEleicao;
                    if (data.totalEleitores !== undefined) document.getElementById('totalEleitores').value = data.totalEleitores;
                    if (data.candidatos && data.candidatos.length > 0) candidatos = data.candidatos;
                    if (data.status) statusAtual = data.status;
                    if (data.turno) turnoAtual = data.turno;
                    if (data.brancos !== undefined) document.getElementById('brancos').value = data.brancos;
                    if (data.nulos !== undefined) document.getElementById('nulos').value = data.nulos;
                    if (data.historico) historicoVotos = data.historico;
                } catch(e) {}
            }
            renderizarFormulario();
        }

        function renderizarFormulario() {
            document.getElementById('turnoInfo').innerText = `Fase Atual: ${turnoAtual}º TURNO (${statusAtual})`;
            const container = document.getElementById('listaCandidatos');
            container.innerHTML = '';

            candidatos.forEach((cand, index) => {
                const box = document.createElement('div');
                box.className = 'cand-card-admin';
                const temFoto = cand.foto && cand.foto.length > 0;
                
                box.innerHTML = `
                    <div class="cand-header-admin">
                        <h3>#${index + 1}</h3>
                        ${candidatos.length > 2 ? `<button type="button" class="btn-remove" onclick="removerCandidato(${index})">Excluir</button>` : ''}
                    </div>
                    
                    <div class="photo-center">
                        ${temFoto 
                            ? `<img id="preview-${index}" src="${cand.foto}" class="preview-img-admin">` 
                            : `<div id="preview-${index}" class="preview-img-admin">👤</div>`}
                        <span id="photo-status-${index}" class="photo-status">
                            ${temFoto ? '✓ Foto salva' : 'Sem foto'}
                        </span>
                    </div>

                    <label>Nome:</label>
                    <input type="text" id="nome-cand-${index}" value="${cand.nome}">
                    
                    <label>Foto (Arquivo):</label>
                    <input type="file" accept="image/*" onchange="carregarEComprimirFoto(event, ${index})">

                    <label>Total de Votos:</label>
                    <input type="number" id="votos-cand-${index}" value="${cand.votos}" min="0">

                    <div class="increment-box">
                        <label style="margin:0; font-size:11px; color:#2563eb;">+ Adicionar Votos:</label>
                        <div class="increment-row">
                            <input type="number" id="add-votos-${index}" placeholder="+ Qtd" min="1">
                            <button type="button" class="btn-inc-add" onclick="adicionarVotosQtd(${index})">+ Somar</button>
                        </div>
                        <div class="quick-btns">
                            <button type="button" class="btn-quick" onclick="adicionarVotosDireto(${index}, 1)">+1</button>
                            <button type="button" class="btn-quick" onclick="adicionarVotosDireto(${index}, 5)">+5</button>
                            <button type="button" class="btn-quick" onclick="adicionarVotosDireto(${index}, 10)">+10</button>
                        </div>
                    </div>
                `;
                container.appendChild(box);
            });

            desenharGraficoAdmin(historicoVotos);
        }

        function adicionarVotosQtd(index) {
            sincronizarCamposDigitados();
            const elInput = document.getElementById(`add-votos-${index}`);
            const qtd = parseInt(elInput ? elInput.value : 0) || 0;
            if (qtd > 0) {
                candidatos[index].votos = (candidatos[index].votos || 0) + qtd;
                renderizarFormulario();
            }
        }

        function adicionarVotosDireto(index, qtd) {
            sincronizarCamposDigitados();
            candidatos[index].votos = (candidatos[index].votos || 0) + qtd;
            renderizarFormulario();
        }

        function carregarEComprimirFoto(event, index) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxDim = 120;

                    let w = img.width;
                    let h = img.height;
                    if (w > h) {
                        if (w > maxDim) { h *= maxDim / w; w = maxDim; }
                    } else {
                        if (h > maxDim) { w *= maxDim / h; h = maxDim; }
                    }

                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    candidatos[index].foto = compressedBase64;
                    
                    renderizarFormulario();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function sincronizarCamposDigitados() {
            candidatos.forEach((cand, index) => {
                const elNome = document.getElementById(`nome-cand-${index}`);
                const elVotos = document.getElementById(`votos-cand-${index}`);
                if (elNome) cand.nome = elNome.value;
                if (elVotos) cand.votos = parseInt(elVotos.value) || 0;
            });
        }

        function adicionarCandidato() {
            sincronizarCamposDigitados();
            candidatos.push({ id: Date.now(), nome: `Candidato ${candidatos.length + 1}`, foto: '', votos: 0 });
            renderizarFormulario();
        }

        function removerCandidato(index) {
            sincronizarCamposDigitados();
            candidatos.splice(index, 1);
            renderizarFormulario();
        }

        function alternarTurno() {
            sincronizarCamposDigitados();
            if (turnoAtual === '1') {
                if (confirm('Deseja avançar para o 2º Turno? Isso selecionará automaticamente os 2 mais votados e zerará os votos para a nova etapa.')) {
                    candidatos.sort((a, b) => b.votos - a.votos);
                    candidatos = candidatos.slice(0, 2).map(c => ({ ...c, votos: 0 }));
                    turnoAtual = '2';
                    statusAtual = 'ABERTA';
                    historicoVotos = [];
                    renderizarFormulario();
                    salvarApuracao();
                }
            } else {
                if (confirm('Voltar para o 1º Turno?')) {
                    turnoAtual = '1';
                    renderizarFormulario();
                    salvarApuracao();
                }
            }
        }

        function setStatus(novoStatus) {
            statusAtual = novoStatus;
            salvarApuracao();
        }

        function salvarApuracao() {
            sincronizarCamposDigitados();

            const agora = new Date();
            const horaFormatada = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const dataHoraFull = agora.toLocaleDateString('pt-BR') + ' às ' + horaFormatada;

            const votosMap = {};
            candidatos.forEach(c => { votosMap[c.nome] = c.votos; });

            historicoVotos.push({ hora: horaFormatada, votosPorCand: votosMap });

            const dados = {
                tituloEleicao: document.getElementById('tituloEleicao').value || 'Eleições - Apuração Oficial',
                status: statusAtual,
                turno: turnoAtual,
                ultimaAtualizacao: dataHoraFull,
                totalEleitores: parseInt(document.getElementById('totalEleitores').value) || 0,
                candidatos: candidatos,
                brancos: parseInt(document.getElementById('brancos').value) || 0,
                nulos: parseInt(document.getElementById('nulos').value) || 0,
                historico: historicoVotos
            };

            try {
                localStorage.setItem('dadosApuracao', JSON.stringify(dados));
                renderizarFormulario();
                alert('Apuração atualizada com sucesso!');
            } catch (e) {
                alert('Erro ao salvar no navegador: memória cheia. Clique no botão de Zerar Sistema.');
            }
        }

        function zerarSistema() {
            if (confirm('⚠️ ATENÇÃO: Deseja realmente ZERAR toda a eleição?\n\nIsso apagará todos os votos, fotos e histórico do gráfico.')) {
                if (confirm('Confirmação Final: Todos os dados serão apagados. Continuar?')) {
                    statusAtual = 'ABERTA';
                    turnoAtual = '1';
                    historicoVotos = [];
                    candidatos = [
                        { id: 1, nome: 'Candidato A', foto: '', votos: 0 },
                        { id: 2, nome: 'Candidato B', foto: '', votos: 0 }
                    ];
                    document.getElementById('totalEleitores').value = 0;
                    document.getElementById('brancos').value = 0;
                    document.getElementById('nulos').value = 0;

                    const dadosLimpos = {
                        tituloEleicao: document.getElementById('tituloEleicao').value || 'Eleições - Apuração Oficial',
                        status: statusAtual,
                        turno: turnoAtual,
                        ultimaAtualizacao: 'Sistema Zerado',
                        totalEleitores: 0,
                        candidatos: candidatos,
                        brancos: 0,
                        nulos: 0,
                        historico: []
                    };

                    localStorage.setItem('dadosApuracao', JSON.stringify(dadosLimpos));
                    renderizarFormulario();
                    alert('Sistema zerado com sucesso!');
                }
            }
        }

        function imprimirBoletim() {
            window.print();
        }

        function desenharGraficoAdmin(historico) {
            const canvas = document.getElementById('graficoAdmin');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            canvas.width = canvas.parentElement.clientWidth - 36 || 600;
            canvas.height = 220;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!historico || historico.length === 0) {
                ctx.fillStyle = '#64748b';
                ctx.font = '14px Segoe UI, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Nenhum histórico registrado para o Boletim ainda.', canvas.width / 2, canvas.height / 2);
                return;
            }

            const candidatosSet = new Set();
            historico.forEach(h => {
                if (h.votosPorCand) {
                    Object.keys(h.votosPorCand).forEach(nome => candidatosSet.add(nome));
                }
            });
            const nomesCandidatos = Array.from(candidatosSet);
            if (nomesCandidatos.length === 0) return;

            const cores = ['#2563eb', '#dc2626', '#16a34a', '#d97706', '#9333ea', '#0891b2', '#e11d48'];

            let maxVotos = 1;
            historico.forEach(h => {
                if (h.votosPorCand) {
                    Object.values(h.votosPorCand).forEach(v => {
                        if (v > maxVotos) maxVotos = v;
                    });
                }
            });

            const paddingLeft = 45;
            const paddingRight = 20;
            const paddingTop = 35;
            const paddingBottom = 35;
            const width = canvas.width - paddingLeft - paddingRight;
            const height = canvas.height - paddingTop - paddingBottom;

            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#64748b';
            ctx.font = '11px Segoe UI, sans-serif';
            ctx.textAlign = 'right';

            const gridLines = 4;
            for (let i = 0; i <= gridLines; i++) {
                const yVal = Math.round((maxVotos / gridLines) * i);
                const yPos = paddingTop + height - (i / gridLines) * height;
                
                ctx.beginPath();
                ctx.moveTo(paddingLeft, yPos);
                ctx.lineTo(paddingLeft + width, yPos);
                ctx.stroke();

                ctx.fillText(yVal, paddingLeft - 8, yPos + 4);
            }

            let legendX = paddingLeft;
            ctx.textAlign = 'left';
            nomesCandidatos.forEach((nome, idx) => {
                const cor = cores[idx % cores.length];
                ctx.fillStyle = cor;
                ctx.fillRect(legendX, 10, 12, 12);
                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 12px Segoe UI, sans-serif';
                ctx.fillText(nome, legendX + 16, 20);
                legendX += ctx.measureText(nome).width + 35;
            });

            const totalPontos = historico.length;
            const stepX = totalPontos > 1 ? width / (totalPontos - 1) : width / 2;

            nomesCandidatos.forEach((nome, idx) => {
                const cor = cores[idx % cores.length];
                ctx.strokeStyle = cor;
                ctx.fillStyle = cor;
                ctx.lineWidth = 3;

                ctx.beginPath();
                historico.forEach((h, i) => {
                    const votos = (h.votosPorCand && h.votosPorCand[nome] !== undefined) ? h.votosPorCand[nome] : 0;
                    const x = totalPontos > 1 ? paddingLeft + (i * stepX) : paddingLeft + width / 2;
                    const y = paddingTop + height - ((votos / maxVotos) * height);

                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();

                historico.forEach((h, i) => {
                    const votos = (h.votosPorCand && h.votosPorCand[nome] !== undefined) ? h.votosPorCand[nome] : 0;
                    const x = totalPontos > 1 ? paddingLeft + (i * stepX) : paddingLeft + width / 2;
                    const y = paddingTop + height - ((votos / maxVotos) * height);

                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                });
            });

            ctx.fillStyle = '#64748b';
            ctx.font = '11px Segoe UI, sans-serif';
            ctx.textAlign = 'center';
            historico.forEach((h, i) => {
                const x = totalPontos > 1 ? paddingLeft + (i * stepX) : paddingLeft + width / 2;
                ctx.fillText(h.hora || '', x, canvas.height - 8);
            });
        }

        carregarDadosSalvos();
    </script>
</body>
</html>
