<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Lançamento (ADMIN)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #2c3e50; color: #fff; padding: 20px; }
        .admin-card { max-width: 500px; margin: 0 auto; background: #34495e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { text-align: center; margin-bottom: 20px; font-size: 22px; }
        .control-btns { display: flex; gap: 10px; margin-bottom: 25px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-open { background-color: #27ae60; color: white; }
        .btn-close { background-color: #c0392b; color: white; }
        .btn-save { background-color: #2980b9; color: white; width: 100%; margin-top: 20px; font-size: 16px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input[type="number"], input[type="text"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #7f8c8d; font-size: 16px; }
    </style>

    <!-- Firebase SDK Compatível -->
    <script src="[suspicious link removed]"></script>
    <script src="[suspicious link removed]"></script>
</head>
<body>
    <div class="admin-card">
        <h1>Gerenciador de Apuração</h1>
        
        <div class="control-btns">
            <button class="btn-open" onclick="setStatus('ABERTA')">Abrir Votação</button>
            <button class="btn-close" onclick="setStatus('FECHADA')">Encerrar Votação</button>
        </div>

        <form id="adminForm">
            <div class="form-group">
                <label>Nome do Candidato 1:</label>
                <input type="text" id="nome1" value="Candidato A">
                <label style="margin-top:5px;">Votos Candidato 1:</label>
                <input type="number" id="votos1" value="0" min="0">
            </div>

            <div class="form-group">
                <label>Nome do Candidato 2:</label>
                <input type="text" id="nome2" value="Candidato B">
                <label style="margin-top:5px;">Votos Candidato 2:</label>
                <input type="number" id="votos2" value="0" min="0">
            </div>

            <div class="form-group">
                <label>Votos Brancos:</label>
                <input type="number" id="brancos" value="0" min="0">
            </div>

            <div class="form-group">
                <label>Votos Nulos:</label>
                <input type="number" id="nulos" value="0" min="0">
            </div>

            <button type="button" class="btn-save" onclick="salvarApuracao()">Atualizar Apuração</button>
        </form>
    </div>

    <script>
        // CONFIGURAÇÃO DO SEU FIREBASE (Mesma chave usada no index.html)
        const firebaseConfig = {
            apiKey: "SEU_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "123456789",
            appId: "SEU_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let statusAtual = 'ABERTA';

        function setStatus(novoStatus) {
            statusAtual = novoStatus;
            salvarApuracao();
            alert('Status da votação alterado para: ' + novoStatus);
        }

        function salvarApuracao() {
            const agora = new Date();
            const dataHora = agora.toLocaleDateString('pt-BR') + ' ' + agora.toLocaleTimeString('pt-BR');

            const dados = {
                status: statusAtual,
                ultimaAtualizacao: dataHora,
                cand1: {
                    nome: document.getElementById('nome1').value,
                    votos: parseInt(document.getElementById('votos1').value) || 0
                },
                cand2: {
                    nome: document.getElementById('nome2').value,
                    votos: parseInt(document.getElementById('votos2').value) || 0
                },
                brancos: parseInt(document.getElementById('brancos').value) || 0,
                nulos: parseInt(document.getElementById('nulos').value) || 0
            };

            db.ref('apuracao').set(dados)
                .then(() => alert('Apuração enviada com sucesso!'))
                .catch(err => alert('Erro ao salvar: ' + err.message));
        }
    </script>
</body>
</html>
