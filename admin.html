<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Gerenciador de Eleições</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: #f1f5f9; color: #0f172a; padding: 20px; }
        .admin-card { max-width: 920px; margin: 0 auto; background: #ffffff; padding: 28px; border-radius: 18px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); border: 1px solid #e2e8f0; }
        
        .header-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px dashed #e2e8f0; padding-bottom: 14px; flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 24px; color: #0f172a; font-weight: 800; }
        
        .btn-main-add { background-color: #16a34a; color: white; padding: 10px 18px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; }
        .btn-back { background-color: #64748b; color: white; padding: 8px 14px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }

        .eleicao-list-item { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 18px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .eleicao-info h3 { font-size: 18px; color: #081d38; font-weight: 800; }
        .eleicao-info p { font-size: 13px; color: #64748b; margin-top: 4px; font-weight: 600; }
        
        .eleicao-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action { padding: 8px 14px; border-radius: 8px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-live { background-color: #2563eb; color: white; }
        .btn-edit { background-color: #d97706; color: white; }
        .btn-delete { background-color: #dc2626; color: white; }

        .badge-live-active { background-color: #dcfce7; color: #15803d; border: 1px solid #86efac; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; display: inline-block; }

        /* Estilos da Área de Edição */
        .control-btns { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
        button { flex: 1; min-width: 130px; padding: 12px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; transition: all 0.2s ease; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .btn-open { background-color: #16a34a; color: white; }
        .btn-close { background-color: #dc2626; color: white; }
        .btn-turno { background-color: #0288d1; color: white; width: 100%; margin-bottom: 16px; font-size: 14px; }
        .btn-add-cand { background-color: #d97706; color: white; margin-bottom: 20px; width: 100%; font-size: 15px; }
        .btn-remove { background-color: #ef4444; color: white; padding: 4px 10px; font-size: 12px; border-radius: 6px; }
        .btn-save { background-color: #2563eb; color: white; width: 100%; margin-top: 20px; font-size: 16px; padding: 14px; }
        .btn-print { background-color: #475569; color: white; width: 100%; margin-top: 10px; font-size: 15px; padding: 12px; }

        .candidatos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .cand-card-admin { 
            background: #f8fafc; 
            padding: 18px; 
            border-radius: 14px; 
            border: 1px solid #e2e8f0; 
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }
        .cand-header-admin { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        .cand-header-admin h3 { font-size: 15px; color: #0f172a; font-weight: 700; }
        
        .photo-center { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 4px 0; }
        .preview-img-admin { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid #2563eb; background-color: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .photo-status { font-size: 11px; font-weight: 600; color: #16a34a; }

        label { display: block; margin-top: 6px; margin-bottom: 4px; font-size: 12px; color: #475569; font-weight: 700; text-transform: uppercase; }
        input[type="number"], input[type="text"], input[type="file"] { width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #cbd5e1; background: #ffffff; color: #0f172a; font-size: 14px; }
        
        .increment-box { background: #ffffff; border: 1px solid #cbd5e1; padding: 10px; border-radius: 8px; margin-top: 4px; }
        .increment-row { display: flex; gap: 6px; margin-top: 4px; }
        .btn-inc-add { background: #16a34a; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; white-space: nowrap; font-size: 13px; }

        .global-box { background: #f8fafc; padding: 18px; border-radius: 14px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .badge-turno-info { text-align: center; font-weight: bold; color: #92400e; background: #fef3c7; padding: 10px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; border: 1px solid #fde68a; }

        .chart-box-admin { background: #f8fafc; padding: 18px; border-radius: 14px; border: 1px solid #e2e8f0; margin-top: 20px; }
        .chart-box-admin h3 { font-size: 15px; color: #0f172a; margin-bottom: 12px; text-align: center; }

        @media print {
            body { background: white; padding: 0; }
            .admin-card { border: none; box-shadow: none; max-width: 100%; width: 100%; padding: 0; }
            .control-btns, .btn-add-cand, .btn-save, .btn-print, .btn-turno, input[type="file"], .btn-remove, .increment-box, .btn-back { display: none !important; }
            input { border: none !important; background: transparent !important; font-weight: bold; font-size: 16px !important; }
            .cand-card-admin { border: 1px solid #cbd5e1 !important; page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="admin-card">
        <!-- VISTA 1: LISTA DE ELEIÇÕES -->
        <div id="viewLista">
            <div class="header-title">
                <h1>📁 Gerenciador de Eleições</h1>
                <button class="btn-main-add" onclick="criarNovaEleicao()">➕ Criar Nova Eleição</button>
            </div>
            <div id="listaEleicoesContainer"></div>
        </div>

        <!-- VISTA 2: EDICAO E LANCAMENTO DA ELEICAO SELECIONADA -->
        <div id="viewDetalhes" style="display: none;">
            <div class="header-title">
                <button class="btn-back" onclick="voltarParaLista()">← Voltar para Lista</button>
                <h1 id="detalhesTitulo">Editar Eleição</h1>
            </div>

            <div id="turnoInfo" class="badge-turno-info">Fase Atual: 1º TURNO</div>
            
            <div class="control-btns">
                <button class="btn-open" onclick="setStatus('ABERTA')">Abrir Votação</button>
                <button class="btn-close" onclick="setStatus('FECHADA')">Encerrar Votação</button>
            </div>

            <button type="button" class="btn-turno" onclick="alternarTurno()">🔄 Alternar / Avançar para 2º Turno (Mesma Eleição)</button>
            <button type="button" class="btn-add-cand" onclick="adicionarCandidato()">+ Adicionar Novo Candidato</button>

            <form id="adminForm">
                <div class="global-box">
                    <h3>Configurações Globais desta Eleição</h3>
                    <label>Título / Nome da Eleição:</label>
                    <input type="text" id="tituloEleicao" placeholder="Ex: Eleição Grêmio Estudantil 2026">
                    
                    <label>Total de Eleitores Aptos (Esperados):</label>
                    <input type="number" id="totalEleitores" value="0" min="0">
                </div>

                <h3 style="margin-bottom: 10px; color: #0f172a;">Candidatos Cadastrados</h3>
                <div id="listaCandidatos" class="candidatos-grid"></div>

                <div class="global-box">
                    <h3>Votos Secundários</h3>
                    <label>Votos Brancos:</label>
                    <input type="number" id="brancos" value="0" min="0">
                    <label>Votos Nulos:</label>
                    <input type="number" id="nulos" value="0" min="0">
                </div>

                <div class="chart-box-admin">
                    <h3>Evolução dos Votos (Boletim de Urna)</h3>
                    <canvas id="graficoAdmin" style="width: 100%; height: 220px;"></canvas>
                </div>

                <button type="button" class="btn-save" onclick="salvarEleicaoAtual(true)">Atualizar Apuração (Lançar Votos)</button>
                <button type="button" class="btn-print" onclick="window.print()">📄 Imprimir Boletim de Apuração</button>
            </form>
        </div>
    </div>

    <script>
        let eleicoes = [];
        let eleicaoAtivaId = null;
        let eleicaoEditandoId = null;

        function inicializar() {
            const salvas = localStorage.getItem('listaEleicoes');
            const ativaId = localStorage.getItem('eleicaoAtivaId');

            if (salvas) {
                try { eleicoes = JSON.parse(salvas); } catch(e) { eleicoes = []; }
            }

            if (!eleicoes || eleicoes.length === 0) {
                // Criar eleição padrão inicial se estiver vazio
                const padrao = {
                    id: 'eleicao_' + Date.now(),
                    tituloEleicao: 'Eleições - Apuração Oficial',
                    status: 'ABERTA',
                    turno: '1',
                    totalEleitores: 500,
                    ultimaAtualizacao: 'Inicializado',
                    brancos: 0,
                    nulos: 0,
                    candidatos: [
                        { id: 1, nome: 'Candidato A', foto: '', votos: 0 },
                        { id: 2, nome: 'Candidato B', foto: '', votos: 0 }
                    ],
                    historico: []
                };
                eleicoes = [padrao];
                eleicaoAtivaId = padrao.id;
                salvarListaNoStorage();
                transmitirParaPúblico(padrao);
            } else {
                eleicaoAtivaId = ativaId || eleicoes[0].id;
            }

            renderizarListaEleicoes();
        }

        function salvarListaNoStorage() {
            localStorage.setItem('listaEleicoes', JSON.stringify(eleicoes));
            localStorage.setItem('eleicaoAtivaId', eleicaoAtivaId);
        }

        function transmitirParaPúblico(eleicao) {
            localStorage.setItem('dadosApuracao', JSON.stringify(eleicao));
        }

        function renderizarListaEleicoes() {
            document.getElementById('viewLista').style.display = 'block';
            document.getElementById('viewDetalhes').style.display = 'none';

            const container = document.getElementById('listaEleicoesContainer');
            container.innerHTML = '';

            eleicoes.forEach(e => {
                const isTransmitindo = (e.id === eleicaoAtivaId);
                const item = document.createElement('div');
                item.className = 'eleicao-list-item';
                
                item.innerHTML = `
                    <div class="eleicao-info">
                        <h3>${e.tituloEleicao || 'Sem título'} ${isTransmitindo ? '<span class="badge-live-active">🟢 TRANSMITINDO AO VIVO</span>' : ''}</h3>
                        <p>Status: <strong>${e.status}</strong> | Fase: <strong>${e.turno}º Turno</strong> | Eleitores: ${e.totalEleitores}</p>
                    </div>
                    <div class="eleicao-actions">
                        <button class="btn-action btn-live" onclick="definirComoAtiva('${e.id}')">${isTransmitindo ? '✓ Ao Vivo' : '🟢 Transmitir ao Vivo'}</button>
                        <button class="btn-action btn-edit" onclick="abrirEdicao('${e.id}')">⚙️ Lançar Votos</button>
                        ${eleicoes.length > 1 ? `<button class="btn-action btn-delete" onclick="excluirEleicao('${e.id}')">🗑️</button>` : ''}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function criarNovaEleicao() {
            const nome = prompt('Digite o Nome/Título da nova Eleição:', 'Eleição para Direção 2026');
            if (!nome) return;

            const nova = {
                id: 'eleicao_' + Date.now(),
                tituloEleicao: nome,
                status: 'ABERTA',
                turno: '1',
                totalEleitores: 100,
                ultimaAtualizacao: 'Criada recentemente',
                brancos: 0,
                nulos: 0,
                candidatos: [
                    { id: Date.now() + 1, nome: 'Candidato 1', foto: '', votos: 0 },
                    { id: Date.now() + 2, nome: 'Candidato 2', foto: '', votos: 0 }
                ],
                historico: []
            };

            eleicoes.push(nova);
            salvarListaNoStorage();
            renderizarListaEleicoes();
        }

        function definirComoAtiva(id) {
            eleicaoAtivaId = id;
            salvarListaNoStorage();
            const eleicao = eleicoes.find(e => e.id === id);
            if (eleicao) transmitirParaPúblico(eleicao);
            renderizarListaEleicoes();
            alert(`A eleição "${eleicao.tituloEleicao}" agora está TRANSMITINDO AO VIVO na tela pública!`);
        }

        function excluirEleicao(id) {
            if (confirm('Deseja realmente excluir esta eleição?')) {
                eleicoes = eleicoes.filter(e => e.id !== id);
                if (eleicaoAtivaId === id && eleicoes.length > 0) {
                    eleicaoAtivaId = eleicoes[0].id;
                    transmitirParaPúblico(eleicoes[0]);
                }
                salvarListaNoStorage();
                renderizarListaEleicoes();
            }
        }

        function abrirEdicao(id) {
            eleicaoEditandoId = id;
            const eleicao = eleicoes.find(e => e.id === id);
            if (!eleicao) return;

            document.getElementById('viewLista').style.display = 'none';
            document.getElementById('viewDetalhes').style.display = 'block';
            document.getElementById('detalhesTitulo').innerText = eleicao.tituloEleicao;

            document.getElementById('tituloEleicao').value = eleicao.tituloEleicao;
            document.getElementById('totalEleitores').value = eleicao.totalEleitores || 0;
            document.getElementById('brancos').value = eleicao.brancos || 0;
            document.getElementById('nulos').value = eleicao.nulos || 0;

            renderizarFormularioCandidatos();
        }

        function voltarParaLista() {
            salvarEleicaoAtual(false);
            renderizarListaEleicoes();
        }

        function getEleicaoAtual() {
            return eleicoes.find(e => e.id === eleicaoEditandoId);
        }

        function renderizarFormularioCandidatos() {
            const eleicao = getEleicaoAtual();
            if (!eleicao) return;

            document.getElementById('turnoInfo').innerText = `Fase Atual: ${eleicao.turno}º TURNO (${eleicao.status})`;
            const container = document.getElementById('listaCandidatos');
            container.innerHTML = '';

            eleicao.candidatos.forEach((cand, index) => {
                const box = document.createElement('div');
                box.className = 'cand-card-admin';
                const temFoto = cand.foto && cand.foto.length > 0;
                
                box.innerHTML = `
                    <div class="cand-header-admin">
                        <h3>#${index + 1}</h3>
                        ${eleicao.candidatos.length > 2 ? `<button type="button" class="btn-remove" onclick="removerCandidato(${index})">Excluir</button>` : ''}
                    </div>
                    
                    <div class="photo-center">
                        ${temFoto 
                            ? `<img id="preview-${index}" src="${cand.foto}" class="preview-img-admin">` 
                            : `<div id="preview-${index}" class="preview-img-admin">👤</div>`}
                        <span id="photo-status-${index}" class="photo-status">
                            ${temFoto ? '✓ Foto salva' : 'Sem foto'}
                        </span>
                    </div>

                    <label>Nome:</label>
                    <input type="text" id="nome-cand-${index}" value="${cand.nome}">
                    
                    <label>Foto (Arquivo):</label>
                    <input type="file" accept="image/*" onchange="carregarEComprimirFoto(event, ${index})">

                    <label>Total de Votos:</label>
                    <input type="number" id="votos-cand-${index}" value="${cand.votos}" min="0">

                    <div class="increment-box">
                        <label style="margin:0; font-size:11px; color:#2563eb;">+ Adicionar Votos:</label>
                        <div class="increment-row">
                            <input type="number" id="add-votos-${index}" placeholder="+ Qtd" min="1">
                            <button type="button" class="btn-inc-add" onclick="processarSomarVotos()">+ Somar</button>
                        </div>
                    </div>
                `;
                container.appendChild(box);
            });

            desenharGraficoAdmin(eleicao.historico || []);
        }

        function sincronizarCampos() {
            const eleicao = getEleicaoAtual();
            if (!eleicao) return;

            eleicao.tituloEleicao = document.getElementById('tituloEleicao').value || eleicao.tituloEleicao;
            eleicao.totalEleitores = parseInt(document.getElementById('totalEleitores').value) || 0;
            eleicao.brancos = parseInt(document.getElementById('brancos').value) || 0;
            eleicao.nulos = parseInt(document.getElementById('nulos').value) || 0;

            eleicao.candidatos.forEach((cand, index) => {
                const elNome = document.getElementById(`nome-cand-${index}`);
                const elVotos = document.getElementById(`votos-cand-${index}`);
                const elAdd = document.getElementById(`add-votos-${index}`);
                
                if (elNome) cand.nome = elNome.value;
                
                let baseVotos = elVotos ? (parseInt(elVotos.value) || 0) : (cand.votos || 0);
                let addVotos = elAdd ? (parseInt(elAdd.value) || 0) : 0;
                
                cand.votos = Math.max(0, baseVotos + addVotos);
            });
        }

        function processarSomarVotos() {
            sincronizarCampos();
            renderizarFormularioCandidatos();
        }

        function carregarEComprimirFoto(event, index) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxDim = 120;

                    let w = img.width;
                    let h = img.height;
                    if (w > h) {
                        if (w > maxDim) { h *= maxDim / w; w = maxDim; }
                    } else {
                        if (h > maxDim) { w *= maxDim / h; h = maxDim; }
                    }

                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    sincronizarCampos();
                    const eleicao = getEleicaoAtual();
                    if (eleicao && eleicao.candidatos[index]) {
                        eleicao.candidatos[index].foto = compressedBase64;
                    }
                    renderizarFormularioCandidatos();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function adicionarCandidato() {
            sincronizarCampos();
            const eleicao = getEleicaoAtual();
            if (eleicao) {
                eleicao.candidatos.push({ id: Date.now(), nome: `Candidato ${eleicao.candidatos.length + 1}`, foto: '', votos: 0 });
                renderizarFormularioCandidatos();
            }
        }

        function removerCandidato(index) {
            sincronizarCampos();
            const eleicao = getEleicaoAtual();
            if (eleicao) {
                eleicao.candidatos.splice(index, 1);
                renderizarFormularioCandidatos();
            }
        }

        function alternarTurno() {
            sincronizarCampos();
            const eleicao = getEleicaoAtual();
            if (!eleicao) return;

            if (eleicao.turno === '1') {
                if (confirm('Deseja avançar para o 2º Turno desta eleição?\n\nIsso selecionará os 2 candidatos mais votados e zerará os votos para a nova etapa.')) {
                    eleicao.candidatos.sort((a, b) => b.votos - a.votos);
                    eleicao.candidatos = eleicao.candidatos.slice(0, 2).map(c => ({ ...c, votos: 0 }));
                    eleicao.turno = '2';
                    eleicao.status = 'ABERTA';
                    eleicao.historico = [];
                    renderizarFormularioCandidatos();
                    salvarEleicaoAtual(true);
                }
            } else {
                if (confirm('Voltar para o 1º Turno desta eleição?')) {
                    eleicao.turno = '1';
                    renderizarFormularioCandidatos();
                    salvarEleicaoAtual(true);
                }
            }
        }

        function setStatus(novoStatus) {
            const eleicao = getEleicaoAtual();
            if (eleicao) {
                eleicao.status = novoStatus;
                salvarEleicaoAtual(true);
            }
        }

        function salvarEleicaoAtual(alertar = false) {
            sincronizarCampos();
            const eleicao = getEleicaoAtual();
            if (!eleicao) return;

            const agora = new Date();
            const horaFormatada = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            eleicao.ultimaAtualizacao = agora.toLocaleDateString('pt-BR') + ' às ' + horaFormatada;

            const votosMap = {};
            eleicao.candidatos.forEach(c => { votosMap[c.nome] = c.votos; });
            
            if (!eleicao.historico) eleicao.historico = [];
            eleicao.historico.push({ hora: horaFormatada, votosPorCand: votosMap });

            salvarListaNoStorage();

            if (eleicao.id === eleicaoAtivaId) {
                transmitirParaPúblico(eleicao);
            }

            renderizarFormularioCandidatos();
            if (alertar) alert('Apuração atualizada e dados gravados com sucesso!');
        }

        function desenharGraficoAdmin(historico) {
            const canvas = document.getElementById('graficoAdmin');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            canvas.width = canvas.parentElement.clientWidth - 36 || 600;
            canvas.height = 220;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!historico || historico.length === 0) {
                ctx.fillStyle = '#64748b';
                ctx.font = '14px Segoe UI, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Nenhum histórico registrado ainda.', canvas.width / 2, canvas.height / 2);
                return;
            }

            const candidatosSet = new Set();
            historico.forEach(h => {
                if (h.votosPorCand) {
                    Object.keys(h.votosPorCand).forEach(nome => candidatosSet.add(nome));
                }
            });
            const nomesCandidatos = Array.from(candidatosSet);
            if (nomesCandidatos.length === 0) return;

            const cores = ['#0288d1', '#dc2626', '#16a34a', '#d97706', '#9333ea', '#0891b2', '#e11d48'];

            let maxVotos = 1;
            historico.forEach(h => {
                if (h.votosPorCand) {
                    Object.values(h.votosPorCand).forEach(v => {
                        if (v > maxVotos) maxVotos = v;
                    });
                }
            });

            const paddingLeft = 45;
            const paddingRight = 20;
            const paddingTop = 35;
            const paddingBottom = 35;
            const width = canvas.width - paddingLeft - paddingRight;
            const height = canvas.height - paddingTop - paddingBottom;

            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.fillStyle = '#64748b';
            ctx.font = '11px Segoe UI, sans-serif';
            ctx.textAlign = 'right';

            const gridLines = 4;
            for (let i = 0; i <= gridLines; i++) {
                const yVal = Math.round((maxVotos / gridLines) * i);
                const yPos = paddingTop + height - (i / gridLines) * height;
                
                ctx.beginPath();
                ctx.moveTo(paddingLeft, yPos);
                ctx.lineTo(paddingLeft + width, yPos);
                ctx.stroke();

                ctx.fillText(yVal, paddingLeft - 8, yPos + 4);
            }

            let legendX = paddingLeft;
            ctx.textAlign = 'left';
            nomesCandidatos.forEach((nome, idx) => {
                const cor = cores[idx % cores.length];
                ctx.fillStyle = cor;
                ctx.fillRect(legendX, 10, 12, 12);
                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 12px Segoe UI, sans-serif';
                ctx.fillText(nome, legendX + 16, 20);
                legendX += ctx.measureText(nome).width + 35;
            });

            const totalPontos = historico.length;
            const stepX = totalPontos > 1 ? width / (totalPontos - 1) : width / 2;

            nomesCandidatos.forEach((nome, idx) => {
                const cor = cores[idx % cores.length];
                ctx.strokeStyle = cor;
                ctx.fillStyle = cor;
                ctx.lineWidth = 3;

                ctx.beginPath();
                historico.forEach((h, i) => {
                    const votos = (h.votosPorCand && h.votosPorCand[nome] !== undefined) ? h.votosPorCand[nome] : 0;
                    const x = totalPontos > 1 ? paddingLeft + (i * stepX) : paddingLeft + width / 2;
                    const y = paddingTop + height - ((votos / maxVotos) * height);

                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();

                historico.forEach((h, i) => {
                    const votos = (h.votosPorCand && h.votosPorCand[nome] !== undefined) ? h.votosPorCand[nome] : 0;
                    const x = totalPontos > 1 ? paddingLeft + (i * stepX) : paddingLeft + width / 2;
                    const y = paddingTop + height - ((votos / maxVotos) * height);

                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                });
            });

            ctx.fillStyle = '#64748b';
            ctx.font = '11px Segoe UI, sans-serif';
            ctx.textAlign = 'center';
            historico.forEach((h, i) => {
                const x = totalPontos > 1 ? paddingLeft + (i * stepX) : paddingLeft + width / 2;
                ctx.fillText(h.hora || '', x, canvas.height - 8);
            });
        }

        inicializar();
    </script>
</body>
</html>
