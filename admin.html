<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador - Lançamento de Votos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #1a252f; color: #ecf0f1; padding: 20px; }
        .admin-card { max-width: 500px; margin: 0 auto; background: #2c3e50; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        h1 { text-align: center; margin-bottom: 20px; font-size: 20px; color: #3498db; }
        .control-btns { display: flex; gap: 10px; margin-bottom: 25px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-open { background-color: #2ecc71; color: white; }
        .btn-close { background-color: #e74c3c; color: white; }
        .btn-save { background-color: #3498db; color: white; width: 100%; margin-top: 20px; font-size: 16px; }
        .form-section { background: #34495e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #415b76; }
        .form-section h3 { margin-bottom: 10px; font-size: 15px; color: #f39c12; }
        label { display: block; margin-top: 8px; margin-bottom: 4px; font-size: 13px; color: #bdc3c7; }
        input[type="number"], input[type="text"] { width: 100%; padding: 9px; border-radius: 6px; border: 1px solid #7f8c8d; background: #1a252f; color: #fff; font-size: 14px; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h1>Painel de Controle - Apuração</h1>
        
        <div class="control-btns">
            <button class="btn-open" onclick="setStatus('ABERTA')">Abrir Votação</button>
            <button class="btn-close" onclick="setStatus('FECHADA')">Encerrar Votação</button>
        </div>

        <form id="adminForm">
            <!-- Candidato 1 -->
            <div class="form-section">
                <h3>Candidato 1</h3>
                <label>Nome:</label>
                <input type="text" id="nome1" value="Candidato A">
                <label>URL da Foto (Link da imagem):</label>
                <input type="text" id="foto1" placeholder="[suspicious link removed]">
                <label>Total de Votos:</label>
                <input type="number" id="votos1" value="0" min="0">
            </div>

            <!-- Candidato 2 -->
            <div class="form-section">
                <h3>Candidato 2</h3>
                <label>Nome:</label>
                <input type="text" id="nome2" value="Candidato B">
                <label>URL da Foto (Link da imagem):</label>
                <input type="text" id="foto2" placeholder="[suspicious link removed]">
                <label>Total de Votos:</label>
                <input type="number" id="votos2" value="0" min="0">
            </div>

            <!-- Outros Votos -->
            <div class="form-section">
                <h3>Votos Secundários</h3>
                <label>Votos Brancos:</label>
                <input type="number" id="brancos" value="0" min="0">
                <label>Votos Nulos:</label>
                <input type="number" id="nulos" value="0" min="0">
            </div>

            <button type="button" class="btn-save" onclick="salvarApuracao()">Atualizar Apuração</button>
        </form>
    </div>

    <script>
        let statusAtual = 'ABERTA';

        function setStatus(novoStatus) {
            statusAtual = novoStatus;
            salvarApuracao();
            alert('Status alterado para: ' + novoStatus);
        }

        function salvarApuracao() {
            const agora = new Date();
            const dataHora = agora.toLocaleDateString('pt-BR') + ' às ' + agora.toLocaleTimeString('pt-BR');

            const dados = {
                status: statusAtual,
                ultimaAtualizacao: dataHora,
                cand1: {
                    nome: document.getElementById('nome1').value,
                    foto: document.getElementById('foto1').value,
                    votos: parseInt(document.getElementById('votos1').value) || 0
                },
                cand2: {
                    nome: document.getElementById('nome2').value,
                    foto: document.getElementById('foto2').value,
                    votos: parseInt(document.getElementById('votos2').value) || 0
                },
                brancos: parseInt(document.getElementById('brancos').value) || 0,
                nulos: parseInt(document.getElementById('nulos').value) || 0
            };

            localStorage.setItem('dadosApuracao', JSON.stringify(dados));
            alert('Apuração atualizada com sucesso!');
        }
    </script>
</body>
</html>
