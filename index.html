<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apuração Oficial - Resultados</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #f0f4f8; color: #1e293b; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
        
        .header { text-align: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 18px; margin-bottom: 24px; }
        .header h1 { font-size: 24px; color: #0f172a; font-weight: 700; }
        .header-badges { display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .status-badge { padding: 5px 14px; border-radius: 20px; font-weight: 600; font-size: 13px; }
        .aberta { background-color: #e0f2fe; color: #0369a1; }
        .fechada { background-color: #fee2e2; color: #b91c1c; }
        .turno-badge { background-color: #fef3c7; color: #92400e; padding: 5px 14px; border-radius: 20px; font-weight: 600; font-size: 13px; }
        .info-bar { font-size: 13px; color: #64748b; text-align: center; margin-top: 8px; }

        .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); }
        .cand-top { display: flex; align-items: center; justify-content: space-between; }
        .cand-info { display: flex; align-items: center; gap: 16px; }
        
        .cand-photo { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid #2563eb; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); background-color: #f8fafc; }
        .cand-name { font-size: 19px; font-weight: 700; color: #0f172a; }

        .badge-eleito { background-color: #16a34a; color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; margin-top: 4px; display: inline-block; }
        .badge-2turno { background-color: #0288d1; color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; margin-top: 4px; display: inline-block; }
        .badge-nao-eleito { background-color: #94a3b8; color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; margin-top: 4px; display: inline-block; }

        .pct-big { font-size: 28px; font-weight: 800; color: #2563eb; text-align: right; line-height: 1; }
        .votos-qtd { font-size: 13px; color: #64748b; text-align: right; margin-top: 4px; }

        .progress-bg { background: #f1f5f9; height: 14px; border-radius: 7px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #2563eb, #3b82f6); height: 100%; width: 0%; transition: width 0.5s ease; border-radius: 7px; }

        .chart-box { background: #f8fafc; padding: 18px; border-radius: 12px; border: 1px solid #e2e8f0; margin-top: 24px; }
        .chart-box h3 { font-size: 15px; color: #0f172a; margin-bottom: 12px; text-align: center; }

        .rodape-votos { display: flex; justify-content: space-around; background: #f8fafc; padding: 16px; border-radius: 12px; font-size: 13px; margin-top: 20px; border: 1px solid #e2e8f0; color: #475569; }
        .rodape-votos div { text-align: center; }
        .rodape-votos span { display: block; font-weight: 700; font-size: 18px; color: #0f172a; margin-top: 4px; }
    </style>

    <!-- Chart.js para o Gráfico de Linhas -->
    <script src="[suspicious link removed]"></script>
    <!-- Firebase SDK -->
    <script src="[suspicious link removed]"></script>
    <script src="[suspicious link removed]"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Eleições - Apuração Oficial</h1>
            <div class="header-badges">
                <div id="statusBadge" class="status-badge aberta">AGUARDANDO DADOS...</div>
                <div id="turnoBadge" class="turno-badge">1º TURNO</div>
            </div>
            <div class="info-bar">Última atualização: <span id="lastUpdate">--:--:--</span></div>
        </div>

        <div id="candidatosContainer"></div>

        <div class="rodape-votos">
            <div>Brancos<span id="votosBrancos">0</span></div>
            <div>Nulos<span id="votosNulos">0</span></div>
            <div>Total Apurado<span id="votosTotais">0</span></div>
        </div>

        <div class="chart-box">
            <h3>Evolução dos Votos em Tempo Real</h3>
            <canvas id="graficoEvolucao" height="200"></canvas>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "SEU_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
            projectId: "SEU_PROJETO"
        };

        const usarFirebase = firebaseConfig.apiKey && firebaseConfig.apiKey !== "SEU_API_KEY";
        let meugrafico = null;

        function renderizar(data) {
            if (!data) return;

            document.getElementById('lastUpdate').innerText = data.ultimaAtualizacao || '--';
            const votacaoAberta = data.status === 'ABERTA';
            const badge = document.getElementById('statusBadge');
            badge.innerText = votacaoAberta ? 'EM APURAÇÃO' : 'VOTAÇÃO ENCERRADA';
            badge.className = 'status-badge ' + (votacaoAberta ? 'aberta' : 'fechada');

            const turno = data.turno || '1';
            document.getElementById('turnoBadge').innerText = turno === '1' ? '1º TURNO' : '2º TURNO';

            const candidatos = (data.candidatos || []).slice();
            const brancos = data.brancos || 0;
            const nulos = data.nulos || 0;

            const totalValidos = candidatos.reduce((sum, c) => sum + (c.votos || 0), 0);
            const totalGeral = totalValidos + brancos + nulos;

            document.getElementById('votosBrancos').innerText = brancos;
            document.getElementById('votosNulos').innerText = nulos;
            document.getElementById('votosTotais').innerText = totalGeral;

            candidatos.sort((a, b) => (b.votos || 0) - (a.votos || 0));

            let html = '';
            candidatos.forEach((c, index) => {
                const votosCand = c.votos || 0;
                const pctValidos = totalValidos > 0 ? ((votosCand / totalValidos) * 100).toFixed(2) : '0.00';
                
                let badgeStatus = '';
                if (!votacaoAberta) {
                    if (turno === '1') {
                        const temMaioriaAbsoluta = votosCand > (totalValidos / 2) && totalValidos > 0;
                        if (temMaioriaAbsoluta) {
                            badgeStatus = index === 0 ? '<div class="badge-eleito">ELEITO NO 1º TURNO</div>' : '<div class="badge-nao-eleito">NÃO ELEITO</div>';
                        } else {
                            if (index === 0 || index === 1) {
                                badgeStatus = '<div class="badge-2turno">VAI PARA O 2º TURNO</div>';
                            } else {
                                badgeStatus = '<div class="badge-nao-eleito">NÃO ELEITO</div>';
                            }
                        }
                    } else {
                        if (index === 0 && totalValidos > 0) {
                            badgeStatus = '<div class="badge-eleito">ELEITO</div>';
                        } else {
                            badgeStatus = '<div class="badge-nao-eleito">NÃO ELEITO</div>';
                        }
                    }
                }

                const fotoUrl = c.foto || '[suspicious link removed]';

                html += `
                    <div class="card">
                        <div class="cand-top">
                            <div class="cand-info">
                                <img src="${fotoUrl}" class="cand-photo" alt="${c.nome}">
                                <div>
                                    <div class="cand-name">${c.nome}</div>
                                    ${badgeStatus}
                                </div>
                            </div>
                            <div>
                                <div class="pct-big">${pctValidos.replace('.', ',')}%</div>
                                <div class="votos-qtd">${votosCand} votos válidos</div>
                            </div>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width: ${pctValidos}%"></div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('candidatosContainer').innerHTML = html;
            atualizarGrafico(data.historico || []);
        }

        function atualizarGrafico(historico) {
            const ctx = document.getElementById('graficoEvolucao').getContext('2d');
            if (historico.length === 0) return;

            const labels = historico.map(h => h.hora);
            const nomesCandidatos = Object.keys(historico[0].votosPorCand || {});
            const cores = ['#2563eb', '#dc2626', '#16a34a', '#d97706', '#9333ea', '#0891b2'];

            const datasets = nomesCandidatos.map((nome, idx) => {
                return {
                    label: nome,
                    data: historico.map(h => (h.votosPorCand && h.votosPorCand[nome] !== undefined) ? h.votosPorCand[nome] : 0),
                    borderColor: cores[idx % cores.length],
                    backgroundColor: cores[idx % cores.length],
                    tension: 0.3,
                    borderWidth: 3,
                    pointRadius: 4
                };
            });

            if (meugrafico) {
                meugrafico.data.labels = labels;
                meugrafico.data.datasets = datasets;
                meugrafico.update();
            } else {
                meugrafico = new Chart(ctx, {
                    type: 'line',
                    data: { labels: labels, datasets: datasets },
                    options: {
                        responsive: true,
                        plugins: { legend: { position: 'top' } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
            }
        }

        if (usarFirebase) {
            firebase.initializeApp(firebaseConfig);
            firebase.database().ref('apuracao').on('value', snapshot => renderizar(snapshot.val()));
        } else {
            function carregarLocal() {
                const salvas = localStorage.getItem('dadosApuracao');
                if (salvas) renderizar(JSON.parse(salvas));
            }
            carregarLocal();
            window.addEventListener('storage', carregarLocal);
            setInterval(carregarLocal, 1000);
        }
    </script>
</body>
</html>
