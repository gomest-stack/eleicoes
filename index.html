<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divulgação de Resultados - Apuração</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #0b1a2d; color: #fff; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: #132742; border-radius: 12px; padding: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid #1c385e; }
        
        .header { text-align: center; border-bottom: 1px solid #1c385e; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 22px; color: #76b9ed; text-transform: uppercase; letter-spacing: 1px; }
        .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; margin-top: 10px; }
        .aberta { background-color: #0288d1; color: #fff; }
        .fechada { background-color: #d32f2f; color: #fff; }
        .info-bar { font-size: 13px; color: #90caf9; text-align: center; margin-top: 8px; }

        .card { background: #1a3557; border: 1px solid #284b75; border-radius: 10px; padding: 18px; margin-bottom: 16px; position: relative; display: flex; flex-direction: column; gap: 12px; }
        .cand-top { display: flex; align-items: center; justify-content: space-between; }
        .cand-info { display: flex; align-items: center; gap: 15px; }
        
        /* Estilo da Foto do Candidato estilo TSE */
        .cand-photo { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 3px solid #2196f3; background-color: #0b1a2d; }
        .cand-name { font-size: 20px; font-weight: bold; color: #fff; }

        .badge-eleito { background-color: #2e7d32; color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 13px; font-weight: bold; }
        .badge-nao-eleito { background-color: #546e7a; color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 13px; }

        .pct-big { font-size: 26px; font-weight: bold; color: #4fc3f7; text-align: right; }
        .votos-qtd { font-size: 13px; color: #b0bec5; text-align: right; }

        .progress-bg { background: #0d2137; height: 16px; border-radius: 8px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #1976d2, #4fc3f7); height: 100%; width: 0%; transition: width 0.4s ease; }

        .rodapé-votos { display: flex; justify-content: space-around; background: #0d2137; padding: 14px; border-radius: 8px; font-size: 14px; margin-top: 20px; border: 1px solid #1c385e; }
        .rodapé-votos div { text-align: center; }
        .rodapé-votos span { display: block; font-weight: bold; font-size: 16px; color: #fff; margin-top: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Eleições - Apuração Oficial</h1>
            <div id="statusBadge" class="status-badge aberta">EM APURAÇÃO</div>
            <div class="info-bar">Última atualização: <span id="lastUpdate">--:--:--</span></div>
        </div>

        <div id="candidatosContainer"></div>

        <div class="rodapé-votos">
            <div>Brancos<span id="votosBrancos">0</span></div>
            <div>Nulos<span id="votosNulos">0</span></div>
            <div>Total Apurado<span id="votosTotais">0</span></div>
        </div>
    </div>

    <script>
        function atualizarTela() {
            const dadosSalvos = localStorage.getItem('dadosApuracao');
            if (!dadosSalvos) return;

            const data = JSON.parse(dadosSalvos);

            document.getElementById('lastUpdate').innerText = data.ultimaAtualizacao || '--';
            const votacaoAberta = data.status === 'ABERTA';
            const badge = document.getElementById('statusBadge');
            badge.innerText = votacaoAberta ? 'EM APURAÇÃO' : 'VOTAÇÃO ENCERRADA';
            badge.className = 'status-badge ' + (votacaoAberta ? 'aberta' : 'fechada');

            const c1 = data.cand1 || { nome: 'Candidato 1', foto: '', votos: 0 };
            const c2 = data.cand2 || { nome: 'Candidato 2', foto: '', votos: 0 };
            const brancos = data.brancos || 0;
            const nulos = data.nulos || 0;

            const totalValidos = c1.votos + c2.votos;
            const totalGeral = totalValidos + brancos + nulos;

            document.getElementById('votosBrancos').innerText = brancos;
            document.getElementById('votosNulos').innerText = nulos;
            document.getElementById('votosTotais').innerText = totalGeral;

            const candidatos = [c1, c2];
            let html = '';

            candidatos.forEach(c => {
                const pctValidos = totalValidos > 0 ? ((c.votos / totalValidos) * 100).toFixed(2) : '0.00';
                const temMaioria = c.votos > (totalValidos / 2) && totalValidos > 0;

                let badgeStatus = '';
                if (!votacaoAberta) {
                    badgeStatus = temMaioria 
                        ? '<span class="badge-eleito">ELEITO</span>' 
                        : '<span class="badge-nao-eleito">NÃO ELEITO</span>';
                }

                const fotoUrl = c.foto || '[suspicious link removed]';

                html += `
                    <div class="card">
                        <div class="cand-top">
                            <div class="cand-info">
                                <img src="${fotoUrl}" class="cand-photo" alt="${c.nome}">
                                <div>
                                    <div class="cand-name">${c.nome}</div>
                                    ${badgeStatus}
                                </div>
                            </div>
                            <div>
                                <div class="pct-big">${pctValidos.replace('.', ',')}%</div>
                                <div class="votos-qtd">${c.votos} votos válidos</div>
                            </div>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width: ${pctValidos}%"></div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('candidatosContainer').innerHTML = html;
        }

        // Atualizar quando carregar e sempre que houver alteração no Admin
        window.onload = atualizarTela;
        window.addEventListener('storage', atualizarTela);
        setInterval(atualizarTela, 1000); // Checagem contínua
    </script>
</body>
</html>
