<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apuração de Resultados - Eleições</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        .header h1 { font-size: 24px; color: #0f2b48; }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-top: 10px; }
        .aberta { background-color: #e3f2fd; color: #0d47a1; }
        .fechada { background-color: #ffebee; color: #b71c1c; }
        .info-bar { font-size: 13px; color: #666; text-align: center; margin-bottom: 20px; }
        
        .card { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; position: relative; }
        .cand-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .cand-name { font-size: 18px; font-weight: bold; color: #1a237e; }
        .badge-eleito { background-color: #2e7d32; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-nao-eleito { background-color: #757575; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        
        .progress-bg { background: #e0e0e0; height: 18px; border-radius: 9px; overflow: hidden; margin-bottom: 8px; }
        .progress-fill { background: #1976d2; height: 100%; width: 0%; transition: width 0.5s ease-in-out; }
        .stats { display: flex; justify-content: space-between; font-size: 14px; color: #424242; }
        
        .secundarios { display: flex; justify-content: space-between; margin-top: 20px; background: #eceff1; padding: 12px; border-radius: 8px; font-size: 13px; }
    </style>

    <!-- Firebase SDK Compatível (sem instalação necessária) -->
    <script src="[suspicious link removed]"></script>
    <script src="[suspicious link removed]"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Apuração em Tempo Real</h1>
            <div id="statusBadge" class="status-badge aberta">Aguardando dados...</div>
        </div>
        <div class="info-bar">
            Última atualização: <span id="lastUpdate">--/--/---- --:--:--</span>
        </div>

        <!-- Lista de Candidatos -->
        <div id="candidatosContainer"></div>

        <!-- Votos Brancos e Nulos -->
        <div class="secundarios">
            <div><strong>Brancos:</strong> <span id="votosBrancos">0</span></div>
            <div><strong>Nulos:</strong> <span id="votosNulos">0</span></div>
            <div><strong>Total de Votos:</strong> <span id="votosTotais">0</span></div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO SEU FIREBASE (Substitua pelos seus dados do Firebase)
        const firebaseConfig = {
            apiKey: "SEU_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
            projectId: "SEU_PROJETO",
            storageBucket: "SEU_PROJETO.appspot.com",
            messagingSenderId: "123456789",
            appId: "SEU_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Escutar alterações em tempo real no banco
        db.ref('apuracao').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            document.getElementById('lastUpdate').innerText = data.ultimaAtualizacao || '--';
            
            const badge = document.getElementById('statusBadge');
            const votacaoAberta = data.status === 'ABERTA';
            badge.innerText = votacaoAberta ? 'EM APURAÇÃO' : 'VOTAÇÃO ENCERRADA';
            badge.className = 'status-badge ' + (votacaoAberta ? 'aberta' : 'fechada');

            const c1 = data.cand1 || { nome: 'Candidato 1', votos: 0 };
            const c2 = data.cand2 || { nome: 'Candidato 2', votos: 0 };
            const brancos = data.brancos || 0;
            const nulos = data.nulos || 0;

            const totalValidos = c1.votos + c2.votos;
            const totalGeral = totalValidos + brancos + nulos;

            document.getElementById('votosBrancos').innerText = brancos;
            document.getElementById('votosNulos').innerText = nulos;
            document.getElementById('votosTotais').innerText = totalGeral;

            const candidatos = [
                { nome: c1.nome, votos: c1.votos },
                { nome: c2.nome, votos: c2.votos }
            ];

            let html = '';
            candidatos.forEach(c => {
                const pctValidos = totalValidos > 0 ? ((c.votos / totalValidos) * 100).toFixed(2) : 0;
                const temMaioriaAbsoluta = c.votos > (totalValidos / 2) && totalValidos > 0;
                
                let badgeStatus = '';
                if (!votacaoAberta) {
                    badgeStatus = temMaioriaAbsoluta 
                        ? '<span class="badge-eleito">ELEITO</span>' 
                        : '<span class="badge-nao-eleito">NÃO ELEITO</span>';
                }

                html += `
                    <div class="card">
                        <div class="cand-header">
                            <span class="cand-name">${c.nome}</span>
                            ${badgeStatus}
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width: ${pctValidos}%"></div>
                        </div>
                        <div class="stats">
                            <span><strong>${pctValidos}%</strong> (Votos Válidos)</span>
                            <span>${c.votos} votos</span>
                        </div>
                    </div>
                `;
            });

            document.getElementById('candidatosContainer').innerHTML = html;
        });
    </script>
</body>
</html>
